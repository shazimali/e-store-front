version: "3.9"

services:
  frontend:
    container_name: everyday-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "8083:80"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.env:/usr/share/nginx/html/.env
