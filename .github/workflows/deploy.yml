name: 🚀 Frontend CI/CD (Fast)

on:
  push:
    branches: [main]
    paths:
      - '**.vue'
      - '**.ts'
      - '**.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'nginx.conf'

env:
  IMAGE_NAME: shazimali/everyday-store-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Setup Docker Buildx
      - uses: docker/setup-buildx-action@v3

      # 3️⃣ Login Docker Hub
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 4️⃣ Build & Push (WITH CACHE)
      - name: Build & Push Image (Cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=https://api.everydaypak.com/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5️⃣ Deploy to VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker rm -f everyday-store-frontend || true
            docker run -d \
              --name everyday-store-frontend \
              -p 8083:80 \
              ${{ env.IMAGE_NAME }}:latest
